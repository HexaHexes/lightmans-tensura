neo_version=21.1.259
loader_version_range=[4,)

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md and agents/REPO.md.
mod_id=lightmans_tensura
mod_name=Lightman's Tensura Economy
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.1
mod_group_id=org.bitwisemadness.lightmanstensura
mod_authors=Bitwise Madness
mod_description=Replaces Tensura's coin and pouch economy with Lightman's Currency:\n- Tensura merchants now trade in Lightman's coins (copper/iron/gold/emerald), keeping the 100:1 exchange ladder (including the coin-exchange trades).\n- Tensura coin pouches are superseded by Lightman's wallets, which evolve tier-to-tier through Gear Evolution (optional - without it, wallets still convert and work, they just do not progress).\n- Bundled datapack retires the old pouches: recipes removed, loot tables and advancements updated, the tensura:coins tag now contains Lightman's coins, and wallet gear-existence chains are added.\n- Existing coins/pouches in inventories and world containers are converted automatically on login/chunk load; /coinconvert sweeps on demand.\n- Optional Tensura: All The Adventure integration pays contract and market rewards in Lightman's coins when that mod is installed.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
