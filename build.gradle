plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'lightmans-tensura'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests live in their own source set: they compile against main, and are
// deliberately NOT part of sourceSets.main - so none of it is packaged into the
// released jar. Declared before neoForge because the mods block below joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    // In-repo gametest run. NeoForge's patched net.minecraft.server.Main reads
    // -Dneoforge.gameTestServer and boots a headless GameTestServer in this
    // project's own run/ folder - no CurseForge instance involved.
    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless test runner. NeoForge's patched server Main boots a
        // GameTestServer that runs every registered @GameTest and exits - no
        // window, no live instance. The namespace gate keeps the run to this
        // repo's tests only, despite the pack's dependency mods staged below.
        gameTestServer {
            server()
            gameDirectory = project.layout.projectDirectory.dir('run')
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'lightmans_tensura'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // The gametest source set joins the mod for the dev runs so
            // @GameTestHolder is discovered from FML's scan data. It is still
            // not in the jar - the jar only packages sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml at build time, so mod identity is edited in one place
// (gradle.properties) rather than duplicated in the toml.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Feed the generated metadata in as a resource dir; passing the task provider
// wires the dependency so the toml is generated before resources are processed.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

configurations {
    // Runtime closure for the gametest run: staged into run/mods below.
    gametestMods
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    mavenCentral()
}

dependencies {
    // Compile-only against the pack's mods (not shipped, not required to build
    // the rest of the project - only WalletItem/WalletData/ModDataComponents
    // need Lightman's Currency at compile time; the gametest suite also links
    // Gear Evolution's RuntimeGearExistenceCatalog). Coordinates are CurseMaven
    // so a clean checkout resolves every jar - never gitignored libs/.
    compileOnly 'curse.maven:lightmans-currency-472521:9048585' // lightmanscurrency-1.21-2.3.0.6
    compileOnly 'curse.maven:gearevolution-1501711:9122235' // gearevolution-1.3.0

    gametestMods 'curse.maven:architectury-419699:8492726'
    gametestMods 'curse.maven:cloth-config-348521:5729127'
    gametestMods 'curse.maven:gearevolution-1501711:9122235'
    gametestMods 'curse.maven:geckolib-388172:8893490'
    gametestMods 'curse.maven:lightmans-currency-472521:9048585'
    // The core jar nests every manascore-* module under META-INF/jars; FML's
    // nested-jar loader installs them at runtime, so only the core is staged.
    gametestMods 'curse.maven:manascore-619025:8022425'
    gametestMods 'curse.maven:smartbrainlib-661293:7055149'
    gametestMods 'curse.maven:tensura-all-the-adventure-1672789:9140357' // tensura_all_the_adventure-0.0.0.5
    gametestMods 'curse.maven:tensura-reincarnated-643695:8793360'
    gametestMods 'curse.maven:terrablender-940057:6054947'
}

// --- gametest harness -------------------------------------------------------

// Stage the pack's dependency mod jars into the run's production-style mods/
// folder, where FML's mods-folder locator finds them exactly like in the pack.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareGametestMods'

    // GameTestServer prints "All N required tests passed :)" or "N required
    // tests failed :(" when the run finishes; grade that so the Gradle build
    // is green/red on its own (crashes fail via the java exit code anyway).
    def expectedTests = 16 // keep in sync with @GameTest methods in src/.../gametest/
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("gametest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << "gametest reported failed tests"
        } else {
            problems << "no gametest summary found in log"
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- JUnit wiring (junit CI check) -------------------------------------------

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/lightmans-tensura')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (report-only grace period) ----------------------------
// Both tools run as the `static` CI job. During the grace period neither can
// block a build: SpotBugs findings are recorded but never fail the task, and
// Spotless is detached from `check` (enforceCheck false) so the junit job's
// `./gradlew build` stays style-agnostic. Gating flips on in a follow-up once
// the finding volume is known; that follow-up also runs one spotlessApply per
// repo to clear the baseline.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
    // Shared EI_EXPOSE_REP/EI_EXPOSE_REP2 exclusions; scope rule in the file.
    excludeFilter = file('config/spotbugs-exclude.xml')}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
