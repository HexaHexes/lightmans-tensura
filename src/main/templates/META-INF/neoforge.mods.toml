# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}_tata.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tensura"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "manascore"
type = "required"
versionRange = "[4.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lightmanscurrency"
type = "required"
versionRange = "[1.21-2.3.0.6,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gearevolution"
type = "optional"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tensura_all_the_adventure"
type = "optional"
versionRange = "[0.0,)"
ordering = "AFTER"
side = "BOTH"