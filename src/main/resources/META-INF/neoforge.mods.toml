[[mods]]
modId = "lightmans_tensura"
version = "1.0.1"
displayName = "Lightman's Tensura Economy"
authors = "kurok"
description = '''
Replaces Tensura's coin and pouch economy with Lightman's Currency:
- Tensura merchants now trade in Lightman's coins (copper/iron/gold/emerald),
  keeping the 100:1 exchange ladder (including the coin-exchange trades).
- Tensura coin pouches are superseded by Lightman's wallets, which evolve
  tier-to-tier through Gear Evolution (optional — without it, wallets still
  convert and work, they just do not progress).
- Bundled datapack retires the old pouches: recipes removed, loot tables and
  advancements updated, the tensura:coins tag now contains Lightman's coins,
  and wallet gear-existence chains are added.
- Existing coins/pouches in inventories and world containers are converted
  automatically on login/chunk load; /coinconvert sweeps on demand.
- Optional Tensura: All The Adventure integration pays contract and market
  rewards in Lightman's coins when that mod is installed.
'''

[[mixins]]
config = "lightmans_tensura.mixins.json"

[[mixins]]
config = "lightmans_tensura_tata.mixins.json"

